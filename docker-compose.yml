services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moviematch}
      POSTGRES_USER: ${POSTGRES_USER:-moviematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moviematch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moviematch} -d ${POSTGRES_DB:-moviematch}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
